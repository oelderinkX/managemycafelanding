    <script>

    function sendRegister() {
        var register = document.getElementById("register");

        var to = 'manage';
        to += 'mycafe@out';
        to += 'look.com';

        var subject = 'Register My Cafe';
        var body = 'Please fill the following,\n\n';
        body += 'Shop name: \n';
        body += 'Shop phone number: \n';
        body += 'Owner names: \n';
        body += 'Manager names: \n\n';
        body += 'Thanks, Manage My Cafe';

        var args = [];

        args.push('subject=' + encodeURIComponent(subject));
        args.push('body=' + encodeURIComponent(body))

        var url = 'mai';
        url += 'lto';
        url += ':' + encodeURIComponent(to);

        if (args.length > 0) {
            url += '?' + args.join('&');
        }

        register.setAttribute('href', url);
    }

    </script>
